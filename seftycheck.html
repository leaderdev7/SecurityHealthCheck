<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardOS | Security Health Check</title>
    
    <!-- Tailwind CSS for Professional Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        
        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .input-field {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem;
            width: 100%;
            color: #f1f5f9;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus { border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

        /* Animated Progress Ring */
        #score-ring { transition: stroke-dashoffset 0.8s ease-in-out; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-6">

    <!-- Auth Section (Visible by Default) -->
    <div id="login-container" class="glass-card p-10 text-center max-w-md w-full">
        <h1 class="text-4xl font-bold text-emerald-400 mb-2">GuardOS</h1>
        <p class="text-slate-400 mb-8">Professional Security Analysis</p>
        <button onclick="mockLogin()" class="w-full bg-white text-slate-900 font-bold py-3 px-6 rounded-xl hover:bg-emerald-500 hover:text-white transition-all">
            Sign in with Google
        </button>
    </div>

    <!-- Dashboard Section (Hidden until Login) -->
    <div id="dashboard" class="hidden glass-card max-w-5xl w-full overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left: Form Input -->
        <div class="p-8 md:w-3/5 border-b md:border-b-0 md:border-r border-slate-700">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-emerald-400">Security Scanner</h2>
                <button onclick="location.reload()" class="text-xs text-slate-500 hover:text-white uppercase tracking-widest">Logout</button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">System Firewall</label>
                    <select id="firewall" class="input-field" onchange="calculateScore()">
                        <option value="0">Disabled (Risky)</option>
                        <option value="30">Active (Protected)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Antivirus Protection</label>
                    <select id="antivirus" class="input-field" onchange="calculateScore()">
                        <option value="0">Not Detected</option>
                        <option value="30">Active Defense</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Password Strength</label>
                    <input type="range" id="password" min="0" max="40" value="10" class="w-full accent-emerald-500" oninput="calculateScore()">
                </div>
            </div>
        </div>

        <!-- Right: Animated Health Result -->
        <div class="p-8 md:w-2/5 flex flex-col items-center justify-center bg-slate-800/30">
            <h3 class="text-xl font-semibold mb-6">Health Score</h3>
            
            <div class="relative w-48 h-48">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-700" />
                    <circle id="score-ring" cx="50" cy="50" r="45" stroke="currentColor" stroke-width="8" fill="transparent" 
                            stroke-dasharray="282.7" stroke-dashoffset="282.7" class="text-emerald-500" />
                </svg>
                <div id="score-text" class="absolute inset-0 flex items-center justify-center text-4xl font-black">0%</div>
            </div>

            <div class="mt-8 text-center">
                <p id="status-label" class="text-emerald-400 font-bold tracking-widest uppercase text-xs mb-2">Scan Required</p>
                <p id="tip-text" class="text-sm text-slate-400 italic px-4">"Adjust sliders to see your real-time security rating."</p>
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // Mock Login Handler (Plug Firebase here)
        function mockLogin() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            calculateScore();
        }

        // Security Logic
        function calculateScore() {
            const fw = parseInt(document.getElementById('firewall').value);
            const av = parseInt(document.getElementById('antivirus').value);
            const pw = parseInt(document.getElementById('password').value);
            
            const total = fw + av + pw;
            
            // UI Updates
            const ring = document.getElementById('score-ring');
            const scoreDisplay = document.getElementById('score-text');
            const statusLabel = document.getElementById('status-label');
            const tipText = document.getElementById('tip-text');

            // Circle Math: Offset = Circumference - (Percent * Circumference / 100)
            const circumference = 2 * Math.PI * 45;
            const offset = circumference - (total / 100) * circumference;
            ring.style.strokeDashoffset = offset;
            scoreDisplay.innerText = `${total}%`;

            // Dynamic Tips
            if (total < 50) {
                statusLabel.innerText = "Critical Risk";
                statusLabel.className = "text-red-400 font-bold tracking-widest uppercase text-xs mb-2";
                tipText.innerText = "Military-grade data protection requires active firewalls and strong encryption.";
            } else if (total < 90) {
                statusLabel.innerText = "Standard Protection";
                statusLabel.className = "text-yellow-400 font-bold tracking-widest uppercase text-xs mb-2";
                tipText.innerText = "Improve your password strength to reach maximum security status.";
            } else {
                statusLabel.innerText = "Hardened System";
                statusLabel.className = "text-emerald-400 font-bold tracking-widest uppercase text-xs mb-2";
                tipText.innerText = "Your system is fully optimized against external threats.";
            }
        }
    </script>
</body>
</html>
